<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Writings - Pycelium</title>
    <style>
        .filter-pill {
            cursor: pointer;
            user-select: none;
            transition: all 0.2s ease;
        }
        .filter-pill.active {
            background-color: #9370DB;
            color: white;
        }
        .filter-pill:not(.active) {
            background-color: rgba(55, 55, 55, 0.8);
            color: #E0E0E0;
        }
        .filter-pill:hover:not(.active) {
            background-color: rgba(75, 85, 99, 0.8);
        }
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #9370DB;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            animation: spin 0.8s linear infinite;
            margin: 2rem auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-dark-background text-light-text font-sans">
    <nav class="bg-dark-secondary sticky top-0 z-10">
        <div class="container mx-auto px-4">
            <div class="flex items-center justify-center h-16">
                <div class="hidden md:block">
                    <div class="flex items-center space-x-4">
                        <a href="/" class="text-dark-text hover:text-white px-3 py-2 rounded-md text-sm font-medium">Home</a>
                        <a href="/about.html" class="text-dark-text hover:text-white px-3 py-2 rounded-md text-sm font-medium">About</a>
                        <a href="/projects.html" class="text-dark-text hover:text-white px-3 py-2 rounded-md text-sm font-medium">Projects</a>
                        <a href="/goals.html" class="text-dark-text hover:text-white px-3 py-2 rounded-md text-sm font-medium">Goals</a>
                        <a href="/community.html" class="text-dark-text hover:text-white px-3 py-2 rounded-md text-sm font-medium">Community</a>
                        <a href="/books.html" class="text-dark-text hover:text-white px-3 py-2 rounded-md text-sm font-medium">Books</a>
                        <a href="/writings.html" class="text-white px-3 py-2 rounded-md text-sm font-medium" aria-current="page">Writings</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <header class="py-12 text-center">
        <h1 class="text-4xl font-bold text-white">Writings</h1>
    </header>

    <main class="container mx-auto px-4 py-8">
        <section>
            <div id="filter-pills" class="flex flex-wrap gap-2 mb-8"></div>
            <div id="writings-grid" class="grid grid-cols-1 md:grid-cols-2 gap-8"></div>
        </section>
    </main>

    <div id="writingModal" class="hidden fixed z-50 inset-0 overflow-y-auto" role="dialog" aria-modal="true">
        <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" aria-hidden="true"></div>
            <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>
            <div class="inline-block align-bottom bg-dark-secondary rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-3xl sm:w-full">
                <div class="bg-dark-secondary px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                    <div class="flex items-start justify-between mb-2">
                        <h3 class="text-xl leading-6 font-medium text-white" id="writingModalTitle">Title</h3>
                        <a href="#" id="writingModalSourceLink" target="_blank" class="text-pycelium-purple hover:underline text-sm whitespace-nowrap ml-4 mt-1">View source</a>
                    </div>
                    <div id="writingModalContent" class="mt-4 max-h-[65vh] overflow-y-auto">
                        <div class="spinner"></div>
                    </div>
                </div>
                <div class="bg-dark-secondary px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse">
                    <button id="closeWritingModal" type="button" class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-gray-600 text-base font-medium text-white hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm">
                        Close
                    </button>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark-secondary text-center py-4">
        <p class="text-dark-text">Copyright 2026 - The Pycelium Company</p>
    </footer>
    <script type="module" src="/src/main.js"></script>
    <script>
        function $(selector) {
            return document.querySelectorAll(selector);
        }

        let writingsData = [];
        let activeFilter = 'all';

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function loadWritings() {
            try {
                const response = await fetch('assets/writings.json');
                writingsData = await response.json();
                renderFilterPills(writingsData);
                renderCards(writingsData);
            } catch (err) {
                document.getElementById('writings-grid').innerHTML =
                    '<p class="text-red-400 col-span-full">Failed to load writings data.</p>';
            }
        }

        function renderFilterPills(data) {
            const container = document.getElementById('filter-pills');
            const categories = ['all', ...new Set(data.map(w => w.category))];

            categories.forEach(cat => {
                const pill = document.createElement('button');
                pill.className = 'filter-pill px-4 py-2 rounded-full text-sm font-medium';
                if (cat === 'all') pill.classList.add('active');
                pill.dataset.filter = cat;
                pill.textContent = cat === 'all' ? 'All' : cat.charAt(0).toUpperCase() + cat.slice(1);
                pill.addEventListener('click', () => setFilter(cat));
                container.appendChild(pill);
            });
        }

        function renderCards(data) {
            const grid = document.getElementById('writings-grid');
            grid.innerHTML = '';

            data.forEach((writing, index) => {
                const card = document.createElement('div');
                card.className = 'bg-dark-secondary rounded-lg p-6';
                card.dataset.category = writing.category;
                card.dataset.status = writing.status;

                const isModalFormat = writing.format === 'txt' || writing.format === 'md';
                const hasFile = writing.file && writing.format;
                const hasLink = writing.link && writing.format === 'web';
                const categoryLabel = writing.category.charAt(0).toUpperCase() + writing.category.slice(1);
                const statusLabel = writing.status === 'published' ? 'Published' : 'Work in Progress';

                let buttonHtml = '';
                if (hasLink) {
                    buttonHtml = `<a href="${escapeHtml(writing.link)}" target="_blank" class="text-pycelium-purple hover:underline text-sm font-medium">Open &rarr;</a>`;
                } else if (hasFile) {
                    buttonHtml = `<button class="text-pycelium-purple hover:underline text-sm font-medium read-btn" data-index="${index}">${isModalFormat ? 'Read' : 'Open'} &rarr;</button>`;
                } else {
                    buttonHtml = '<span class="text-xs text-gray-600">No file yet</span>';
                }

                card.innerHTML = `
                    <div class="flex items-start mb-2">
                        <h3 class="text-xl font-bold">${escapeHtml(writing.title)}</h3>
                    </div>
                    ${writing.date ? `<p class="text-gray-500 text-xs mb-2">${escapeHtml(writing.date)}</p>` : ''}
                    <p class="text-dark-text mb-4">${escapeHtml(writing.description)}</p>
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-3 text-xs">
                            <span><span class="text-gray-500">Category:</span> <span class="text-gray-400">${categoryLabel}</span></span>
                            <span class="w-px h-3 bg-gray-600" aria-hidden="true"></span>
                            <span><span class="text-gray-500">Status:</span> <span class="text-gray-400">${statusLabel}</span></span>
                        </div>
                        ${buttonHtml}
                    </div>
                `;

                grid.appendChild(card);
            });

            document.querySelectorAll('.read-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const index = parseInt(btn.dataset.index);
                    const writing = writingsData[index];
                    if (writing.format === 'txt' || writing.format === 'md') {
                        openModal(writing);
                    } else {
                        window.open('assets/writings/' + writing.file, '_blank');
                    }
                });
            });

            applyFilter(activeFilter);
        }

        function setFilter(type) {
            activeFilter = type;
            document.querySelectorAll('.filter-pill').forEach(pill => {
                pill.classList.toggle('active', pill.dataset.filter === type);
            });
            applyFilter(type);
        }

        function applyFilter(type) {
            document.querySelectorAll('#writings-grid > div').forEach(card => {
                if (type === 'all' || card.dataset.category === type) {
                    card.classList.remove('hidden');
                } else {
                    card.classList.add('hidden');
                }
            });
        }

        const modal = document.getElementById('writingModal');
        const modalTitle = document.getElementById('writingModalTitle');
        const modalSourceLink = document.getElementById('writingModalSourceLink');
        const modalContent = document.getElementById('writingModalContent');
        const closeModalButton = document.getElementById('closeWritingModal');

        async function openModal(writing) {
            modalTitle.textContent = writing.title;
            modalSourceLink.href = 'assets/writings/' + writing.file;
            modalContent.innerHTML = '<div class="spinner"></div>';
            modal.classList.remove('hidden');

            try {
                const response = await fetch('assets/writings/' + writing.file);
                if (!response.ok) throw new Error('Failed to load');
                const text = await response.text();
                modalContent.innerHTML = '<pre class="text-dark-text font-mono text-sm whitespace-pre-wrap">' + escapeHtml(text) + '</pre>';
            } catch (err) {
                modalContent.innerHTML = '<p class="text-red-400">Failed to load content.</p>';
            }
        }

        function closeModal() {
            modal.classList.add('hidden');
        }

        closeModalButton.addEventListener('click', closeModal);

        window.addEventListener('click', (event) => {
            if (event.target === modal) {
                closeModal();
            }
        });

        window.addEventListener('keydown', (event) => {
            if (event.key === 'Escape' && !modal.classList.contains('hidden')) {
                closeModal();
            }
        });

        document.addEventListener('DOMContentLoaded', loadWritings);
    </script>
</body>
</html>
